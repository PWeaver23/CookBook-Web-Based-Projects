spring.application.name=cookbook-api

# ----- MongoDB -----
# Where the database is. The default works when MongoDB runs on this computer
# (e.g. the "mongo" container from compose.yaml, which is published on port 27017).
# Docker Compose overrides this for the API container (see api/compose.yaml).
# No real passwords in this file: set MONGODB_URI as an environment variable instead.
spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017}
spring.mongodb.database=${MONGODB_DATABASE:cookbook_db}

# Adds the temporary test recipes on startup when the recipes collection is empty (see RecipeSeeder).
cookbook.seed-test-recipes=true

# Secrets come from the environment, never from a file in git:
#   in Docker: compose.yaml passes JWT_SECRET and ADMIN_PASSWORD from the .env file next to it
#   from VS Code: the next line reads that same ../.env file (it's in .gitignore)
spring.config.import=optional:file:../.env[.properties]
# Signs every token (HS256 needs at least 32 characters)
cookbook.jwt-secret=${JWT_SECRET}
# The password for the "admin" user created on startup (AdminSeeder)
cookbook.admin-password=${ADMIN_PASSWORD}
# How long a token stays valid
cookbook.token-minutes=120