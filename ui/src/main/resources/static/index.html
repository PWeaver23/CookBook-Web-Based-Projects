<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Online Cookbook</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<main>
    <h1>Online Cookbook</h1>

    <button popovertarget="logInButton">Log in</button>

    <div id="logInButton" popover>
        <section class="card" id="loginCard">
        <h2>Log in</h2>
        <form id="loginForm">
            <input id="username" placeholder="Username" autocomplete="username">
            <input id="password" type="password" placeholder="Password (8+ characters)" autocomplete="current-password">
            <button type="submit">Log in</button>
            <button type="button" id="registerButton">Register</button>
            <button popovertarget="myPopover" popovertargetaction="hide">Close</button>
        </form>
        <p id="loginMessage" class="error"></p>
    </section>
    </div>
    
    
    <div id="recipeCards"></div>

</main>
<script src="app.js"></script>
</body>
</html>
