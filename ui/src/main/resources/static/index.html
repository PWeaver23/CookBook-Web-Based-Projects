<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Online Cookbook</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<main>
    <h1>Online Cookbook</h1>

    <div id="utilityBar">
        <div class="utility-buttons">
            <button id="openLogin" type="button" popovertarget="loginPopover">Log in</button>
            <button id="logoutButton" type="button" hidden>Log out</button>
            <button id="addRecipeButton" type="button" popovertarget="addRecipePopover" hidden>Add Recipe</button>
        </div>
        <span id="welcome" hidden></span>
    </div>

    <div id="addRecipePopover" popover>
        <section class="card" id="addRecipeCard">
            <h2>Add Recipe</h2>
            <form id="addRecipeForm">
                <input id="recipeName" placeholder="Recipe Name" required>

                <!-- dropdown for recipe types, loaded in js from the enum -->
                <select id="recipeType" required>
                    <option value=""></option>
                    <!-- app.js adds one option per type from RecipeType.java -->
                </select>

                <!-- one input for ingredient (two boxes [ingredient] - [measurement]) - button to add another input below -->
                <div id="ingredientRows">
                    <span class="ingredient-row">
                        <input placeholder="Ingredient name (Flour)" required>
                        <input placeholder="Ingredient measure (1/3 Cup)" required>
                    </span>
                </div>
                <button type="button" id="addIngredientRow" >Add Row</button>

                <!-- one input for step - button to add another input below -->
                <div id="stepRows">
                    <span class="step-row">
                        <input id="step" placeholder="Recipe step" required>
                    </span>
                </div>
                <button type="button" id="addStepRow">Add Row</button>

                <div class="form-actions">
                    <button type="submit" id="finishRecipe">Add Recipe</button>
                    <button type="button" id="closeAddButton">Close</button>
                </div>
            </form>
        </section>
    </div>

    <div id="loginPopover" popover>
        <section class="card" id="loginCard">
            <h2>Log in</h2>
            <form id="loginForm">
                <input id="username" placeholder="Username" autocomplete="username">
                <input id="password" type="password" placeholder="Password (8+ characters)" autocomplete="current-password">
                <button type="submit">Log in</button>
                <button type="button" id="registerButton">Register</button>
                <button type="button" popovertarget="loginPopover" popovertargetaction="hide">Close</button>
            </form>
            <p id="loginMessage" class="error"></p>
        </section>
    </div>

    <div id="recipeCards"></div>

</main>
<script src="app.js"></script>
</body>
</html>
